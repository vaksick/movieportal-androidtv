# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# App version (override with -Papp.versionName=… -Papp.versionCode=…). Debug builds get a "-debug" suffix.
# Increase app.versionCode for every upload to Google Play.
app.versionName=1.0.0
app.versionCode=1
